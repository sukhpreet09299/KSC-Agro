<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KSC Admin</title><link rel="stylesheet" href="styles.css"><style>main{max-width:1050px;margin:35px auto;padding:20px}input,select,textarea{padding:10px;border:1px solid #ccc;border-radius:7px;max-width:100%}form{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}button{cursor:pointer;padding:10px 15px;background:#176b3a;color:white;border:0;border-radius:7px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ddd;padding:10px;text-align:left;word-break:break-word}.scroll{overflow:auto}.panel{background:#fff;border:1px solid #ddd;border-radius:12px;padding:20px;margin:20px 0}#dashboard{display:none}textarea{width:100%;min-height:70px}</style><style>body{background-image:linear-gradient(rgba(255,255,255,.965),rgba(255,255,255,.965)),url("assets/wheat-pattern.png");background-size:auto,430px auto}</style></head><body><main><h1>KSC Admin</h1><section id="login" class="panel"><h2>Sign in</h2><form id="loginForm"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button>Login</button></form></section><section id="dashboard"><button id="logout">Logout</button><div class="panel"><h2>Customer enquiries</h2><div class="scroll"><table><thead><tr><th>Date</th><th>Name</th><th>Phone</th><th>Email</th><th>Equipment</th><th>Message</th><th>Status</th></tr></thead><tbody id="enquiries"></tbody></table></div></div><div class="panel"><h2>Equipment management</h2><form id="productForm"><input type="hidden" name="id"><input name="name" placeholder="Equipment name" required><select name="category"><option value="power">Tractors & Power</option><option value="tillage">Tillage</option><option value="crop">Crop Care</option><option value="parts">Parts</option><option value="other">Other</option></select><input name="tag" placeholder="Tag"><input name="image_url" placeholder="HTTPS image URL"><textarea name="description" placeholder="Description"></textarea><label><input type="checkbox" name="active" checked> Active</label><button>Save equipment</button><button type="reset">Clear</button></form><div class="scroll"><table><thead><tr><th>Name</th><th>Category</th><th>Active</th><th>Actions</th></tr></thead><tbody id="products"></tbody></table></div></div></section><p id="status" role="status"></p></main><script src="admin.js"></script></body></html>
